# VoLTE小区监控预警报表

name: VoLTE小区监控预警
table_key: VoLTE小区监控预警数据表-天
table_name: csem.f_nk_volte_keykpi_cell_d
fieldtype: VoLTE小区监控预警数据表-天
api_type: table

dimension:
  geographicdimension: 小区
  timedimension: 天
  enodebField: enodeb_id
  cgiField: cgi
  timeField: starttime
  cellField: cell
  cityField: city

# 字段列表
fields:
  - {feild: starttime, feildName: 时间, datatype: timestamp, columntype: 1}
  - {feild: city, feildName: 地市, datatype: character varying, columntype: 1}
  - {feild: cgi, feildName: 小区, datatype: character varying, columntype: 1}
  - {feild: grid, feildName: 责任网格, datatype: character varying, columntype: 1}
  - {feild: area, feildName: 区县, datatype: character varying, columntype: 1}
  - {feild: nrcell_name, feildName: 小区名称, datatype: character varying, columntype: 1}
  # 注册成功率指标（控制面）
  - {feild: cs_reg1_suss_rate, feildName: 初始注册成功率（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_reg_suss_rate, feildName: VoLTE注册成功率（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_reg_sbc_suss_rate, feildName: SBC注册成功率（控制面）, datatype: numeric, columntype: 1}
  # 接通率指标（控制面）
  - {feild: cs_moc_sbc_suss_rate, feildName: 始呼接通率（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_moc_sbc_180_suss_rate, feildName: 始呼接通率(180)（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_mtc_sbc_suss_rate, feildName: 终呼接通率（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_mtc_sbc_180_suss_rate, feildName: 终呼接通率(180)（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_sbc_suss_rate, feildName: 呼叫接通率(MOC+MTC)（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_sbc_180_suss_rate, feildName: 呼叫接通率(180_MOC+MTC)（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_moc_sbc_net_suss_rate, feildName: 始呼网络接通率（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_sbc_net_suss_rate, feildName: 网络接通率(MOC+MTC)（控制面）, datatype: numeric, columntype: 1}
  # 掉话率（控制面）
  - {feild: cs_sbc_drops_rate, feildName: VOLTE+掉话率（控制面）, datatype: numeric, columntype: 1}
  # SRVCC指标（控制面）
  - {feild: cs_xsrvcc_ho_suss_rate, feildName: xSRVCC切换成功率（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_ho_len_avg, feildName: SRVCC平均切换时长(ms)（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_ho_rtp_delay_avg, feildName: SRVCC平均媒体切换时长(ms)（控制面）, datatype: numeric, columntype: 1}
  # 接续时长（控制面）
  - {feild: cs_alert_delay_vf_avg, feildName: 呼叫建立平均时长(V-固网IMS)（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_alert_delay_vv_avg, feildName: 呼叫建立平均时长(V2V)（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_alert_delay_vall_rate, feildName: 呼叫建立平均时长(V2ALL)（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_mt_alert_delay_avg, feildName: 终呼平均接续时长(ms)（控制面）, datatype: numeric, columntype: 1}
  # MOS指标（会话）
  - {feild: mconv_rtp_ul_mos_avg, feildName: RTP上行平均MOS（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtp_dl_mos_avg, feildName: RTP下行平均MOS（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_mos_300_nok_rate, feildName: RTP上行MOS 3.0 差占比率（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtcp_ul_mos_avg, feildName: RTCP上行平均MOS（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtcp_dl_mos0, feildName: RTCP下行平均MOS（会话）, datatype: numeric, columntype: 1}
  # 丢包率（会话）
  - {feild: mconv_rtp_ul_pkts_lost_rate, feildName: RTP上行丢包率（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtp_dl_pkts_lost_rate, feildName: RTP下行丢包率（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtcp_ul_pkts_lost_rate, feildName: RTCP上行丢包率（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtcp_dl_pkts_lost_rate, feildName: RTCP下行丢包率（会话）, datatype: numeric, columntype: 1}
  # 语音质量（会话）
  - {feild: mconv_single_voice_call_rate, feildName: VoLTE语音单通率（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_dx_call_rate, feildName: VoLTE语音断续/掉话率（会话）, datatype: numeric, columntype: 1}
  # 时延（会话）
  - {feild: mconv_rtp_ul_delay_avg, feildName: RTP上行平均时延(us)（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtp_dl_delay_avg, feildName: RTP下行平均时延(us)（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtcp_ul_delay_avg, feildName: RTCP上行平均时延(us)（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtcp_dl_delay_avg, feildName: RTCP下行平均时延(us)（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_dl_mos_300_nok_rate, feildName: RTP下行MOS 3.0 差占比率（会话）, datatype: numeric, columntype: 1}
  # VoLTE语音上行质差（片段）
  - {feild: msli_ul_tunzi_len_rate, feildName: VoLTE语音上行质差率（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_ul_duanxu_len_rate, feildName: VoLTE语音上行断续率（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_ul_dantong_len_rate, feildName: VoLTE语音上行单通率（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_ul_mos_poor_len_rate, feildName: VoLTE上行MOS质差率（片段）, datatype: numeric, columntype: 1}
  # VoLTE语音下行质差（片段）
  - {feild: msli_dl_tunzi_len_rate, feildName: VoLTE语音下行质差率（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_duanxu_len_rate, feildName: VoLTE语音下行断续率（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_dantong_len_rate, feildName: VoLTE语音下行单通率（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_mos_poor_len_rate, feildName: VoLTE下行MOS质差率（片段）, datatype: numeric, columntype: 1}
  # 对端MOS（片段）
  - {feild: msli_ul_mos_v2v_avg, feildName: VoLTE上行平均MOS（对端VoLTE）（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_ul_mos_v2f_avg, feildName: VoLTE上行平均MOS（对端EPS FB）（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_ul_mos_v2n_avg, feildName: VoLTE上行平均MOS（对端VoNR）（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_ul_mos_v2cs_avg, feildName: VoLTE上行平均MOS（对端CS）（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_ul_mos_v2all_avg, feildName: VoLTE上行平均MOS(对端ALL)（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_mos_v2v_avg, feildName: VoLTE下行平均MOS（对端VoLTE）（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_mos_v2f_avg, feildName: VoLTE下行平均MOS（对端EPS FB）（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_mos_v2n_avg, feildName: VoLTE下行平均MOS（对端VoNR）（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_mos_v2cs_avg, feildName: VoLTE下行平均MOS（对端CS）（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_mos_v2all_avg, feildName: VoLTE下行平均MOS(对端ALL)（片段）, datatype: numeric, columntype: 1}
  # RTP丢包率（片段）
  - {feild: msli_ul_rtp_lost_rate, feildName: 上行RTP丢包率（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_rtp_lost_rate, feildName: 下行RTP丢包率（片段）, datatype: numeric, columntype: 1}
  # VoLTE统计指标
  - {feild: volte_sbc_net_suss, feildName: VoLTE_网络接通次数(MOC+MTC), datatype: numeric, columntype: 1}
  - {feild: volte_sbc_net_sums, feildName: VoLTE_网络试呼次数(MOC+MTC), datatype: numeric, columntype: 1}
  - {feild: volte_sbc_drops, feildName: VoLTE_掉话次数, datatype: numeric, columntype: 1}
  - {feild: volte_sbc_ans, feildName: VoLTE_应答复次数(掉话率), datatype: numeric, columntype: 1}
  # VoLTE语音指标
  - {feild: volte_local_radio_single_voice_call, feildName: VoLTE_语音本端无线单通通话次数, datatype: numeric, columntype: 1}
  - {feild: volte_local_radio_dx_call, feildName: VoLTE_语音本端无线断续通话次数, datatype: numeric, columntype: 1}
  - {feild: volte_ans_voice_call, feildName: VoLTE_语音通话总次数, datatype: numeric, columntype: 1}
  - {feild: volte_local_radio_dtdx_rate, feildName: VoLTE_单通断续次数占比, datatype: numeric, columntype: 1}
  # VoLTE上行时长
  - {feild: volte_ul_tunzi_len, feildName: VoLTE_语音上行质差时长(s), datatype: numeric, columntype: 1}
  - {feild: volte_ul_dantong_len, feildName: VoLTE_语音上行单通时长(s), datatype: numeric, columntype: 1}
  - {feild: volte_ul_duanxu_len, feildName: VoLTE_语音上行断续时长(s), datatype: numeric, columntype: 1}
  - {feild: volte_ul_voice_sum_len, feildName: VoLTE_语音上行总时长(s), datatype: numeric, columntype: 1}
  # VoLTE下行时长
  - {feild: volte_dl_tunzi_len, feildName: VoLTE_语音下行质差时长(s), datatype: numeric, columntype: 1}
  - {feild: volte_dl_dantong_len, feildName: VoLTE_语音下行单通时长(s), datatype: numeric, columntype: 1}
  - {feild: volte_dl_duanxu_len, feildName: VoLTE_语音下行断续时长(s), datatype: numeric, columntype: 1}
  - {feild: volte_dl_voice_sum_len, feildName: VoLTE_语音下行总时长(s), datatype: numeric, columntype: 1}
  # 扩展字段
  - {feild: micro_grid, feildName: 微网格标识, datatype: character varying, columntype: 1}
  - {feild: cover_scene1, feildName: 覆盖场景1, datatype: character varying, columntype: 1}
  - {feild: cover_scene2, feildName: 覆盖场景2, datatype: character varying, columntype: 1}
  - {feild: cover_scene3, feildName: 覆盖场景3, datatype: character varying, columntype: 1}
  - {feild: cover_scene4, feildName: 覆盖场景4, datatype: character varying, columntype: 1}
  - {feild: grid_road, feildName: 网格道路, datatype: character varying, columntype: 1}
  - {feild: marketduty, feildName: 市场职责, datatype: character varying, columntype: 1}
  - {feild: vendor, feildName: 厂商, datatype: character varying, columntype: 1}
  - {feild: state, feildName: 网元状态, datatype: character varying, columntype: 1}
  - {feild: coverage_type, feildName: 覆盖类型, datatype: character varying, columntype: 1}
  - {feild: network_type, feildName: 网络制式, datatype: character varying, columntype: 1}
  - {feild: freq, feildName: 频段_无线, datatype: character varying, columntype: 1}

# 查询条件
conditions:
  where:
    - {feild: starttime, datatype: timestamp, symbol: '>=', val: '{start_date} 00:00:00', whereCon: and, query: true}
    - {feild: starttime, datatype: timestamp, symbol: '<', val: '{end_date} 23:59:59', whereCon: and, query: true}
    - {feild: city, datatype: character, symbol: in, val: '{city}', whereCon: and, query: true}
  fixed_params:
    draw: 1
    start: 0
    length: 200
    total: 0
    indexcount: 0
