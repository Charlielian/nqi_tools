# VoLTE小区监控预警报表

name: VoLTE小区监控预警
table_key: VoLTE小区监控预警数据表-天
table_name: csem.f_nk_volte_keykpi_cell_d
fieldtype: VoLTE小区监控预警数据表-天
api_type: table

dimension:
  geographicdimension: 小区
  timedimension: 天
  enodebField: enodeb_id
  cgiField: cgi
  timeField: starttime
  cellField: cell
  cityField: city

# 字段列表
fields:
  - {feild: starttime, feildName: 时间, datatype: timestamp, columntype: 1}
  - {feild: city, feildName: 地市, datatype: character varying, columntype: 1}
  - {feild: cgi, feildName: 小区, datatype: character varying, columntype: 1}
  - {feild: grid, feildName: 责任网格, datatype: character varying, columntype: 1}
  - {feild: area, feildName: 区县, datatype: character varying, columntype: 1}
  - {feild: nrcell_name, feildName: 小区名称, datatype: character varying, columntype: 1}
  - {feild: cs_reg1_suss_rate, feildName: 初始注册成功率（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_reg_suss_rate, feildName: VoLTE注册成功率（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_sbc_suss_rate, feildName: 呼叫接通率(MOC+MTC)（控制面）, datatype: numeric, columntype: 1}
  - {feild: cs_sbc_drops_rate, feildName: VOLTE+掉话率（控制面）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtp_ul_mos_avg, feildName: RTP上行平均MOS（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtp_dl_mos_avg, feildName: RTP下行平均MOS（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtp_ul_pkts_lost_rate, feildName: RTP上行丢包率（会话）, datatype: numeric, columntype: 1}
  - {feild: mconv_rtp_dl_pkts_lost_rate, feildName: RTP下行丢包率（会话）, datatype: numeric, columntype: 1}
  - {feild: msli_ul_tunzi_len_rate, feildName: VoLTE语音上行质差率（片段）, datatype: numeric, columntype: 1}
  - {feild: msli_dl_tunzi_len_rate, feildName: VoLTE语音下行质差率（片段）, datatype: numeric, columntype: 1}
  - {feild: volte_sbc_net_suss, feildName: VoLTE_网络接通次数(MOC+MTC), datatype: numeric, columntype: 1}
  - {feild: volte_sbc_drops, feildName: VoLTE_掉话次数, datatype: numeric, columntype: 1}
  - {feild: volte_ul_tunzi_len, feildName: VoLTE_语音上行质差时长(s), datatype: numeric, columntype: 1}
  - {feild: volte_dl_tunzi_len, feildName: VoLTE_语音下行质差时长(s), datatype: numeric, columntype: 1}

# 查询条件
conditions:
  where:
    - {feild: starttime, datatype: timestamp, symbol: '>=', val: '{start_date} 00:00:00', whereCon: and, query: true}
    - {feild: starttime, datatype: timestamp, symbol: '<', val: '{end_date} 23:59:59', whereCon: and, query: true}
    - {feild: city, datatype: character, symbol: in, val: '{city}', whereCon: and, query: true}
  fixed_params:
    draw: 1
    start: 0
    length: 200
    total: 0
    indexcount: 0
