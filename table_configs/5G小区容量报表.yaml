# 5G小区容量报表
# 用于查询5G小区的容量情况

name: 5G小区容量报表
table_key: 5G小区容量报表 - 天粒度
table_name: appdbv3.a_adhoc_capacity_nr_nrcell_d
fieldtype: 5G小区容量报表 - 天粒度
api_type: table

dimension:
  geographicdimension: 小区
  timedimension: 天
  enodebField: enodeb_id
  cgiField: ncgi
  timeField: starttime
  cellField: nrcell
  cityField: city

# 字段列表
fields:
  - {feild: starttime, feildName: 记录开始时间, datatype: character varying, columntype: 1}
  - {feild: endtime, feildName: 记录结束时间, datatype: character varying, columntype: 1}
  - {feild: city, feildName: 地市, datatype: character varying, columntype: 1}
  - {feild: grid, feildName: 责任网格, datatype: character varying, columntype: 1}
  - {feild: nrcell_name, feildName: 小区名称, datatype: character varying, columntype: 2}
  - {feild: ncgi, feildName: NCGI, datatype: character varying, columntype: 1}
  - {feild: busy_hour, feildName: 忙时, datatype: timestamp, columntype: 1}
  - {feild: state, feildName: 网元状态, datatype: character varying, columntype: 1}
  - {feild: vendor, feildName: 厂家, datatype: character varying, columntype: 1}
  - {feild: frequency_band_detail, feildName: 详细使用频段, datatype: character varying, columntype: 1}
  - {feild: freq, feildName: 使用频段, datatype: character varying, columntype: 1}
  - {feild: cover_type, feildName: 覆盖类型, datatype: character varying, columntype: 1}
  - {feild: cover_scene, feildName: 覆盖场景, datatype: character varying, columntype: 1}
  - {feild: is_remote, feildName: 是否拉远, datatype: boolean, columntype: 1}
  - {feild: station_name, feildName: 所属基站, datatype: character varying, columntype: 1}
  - {feild: longitude, feildName: 经度, datatype: decimal, columntype: 1}
  - {feild: latitude, feildName: 纬度, datatype: decimal, columntype: 1}
  - {feild: bh_pdcchcceoccupancyrate, feildName: 忙时PDCCH信道CCE占用率(%), datatype: decimal, columntype: 1}
  - {feild: bh_prbassnrateul, feildName: 忙时上行PRB平均利用率(%), datatype: decimal, columntype: 1}
  - {feild: bh_prbassnratedl, feildName: 忙时下行PRB平均利用率(%), datatype: decimal, columntype: 1}
  - {feild: bh_cellprbrate, feildName: 忙时小区PRB利用率, datatype: character varying, columntype: 1}
  - {feild: rlc_upoctudl, feildName: 日RLC层上下行总流量(G), datatype: decimal, columntype: 1}
  - {feild: pdcp_upoctudl, feildName: 日PDCP层上下行总流量(G), datatype: decimal, columntype: 1}
  - {feild: bh_rrc_connmean, feildName: RRC连接平均数-忙时, datatype: character varying, columntype: 2}
  - {feild: bh_rrc_connmax, feildName: RRC连接最大数-忙时, datatype: character varying, columntype: 2}
  - {feild: is_highload, feildName: 是否高负荷待扩容小区, datatype: boolean, columntype: 1}
  - {feild: micro_grid, feildName: 微网格标识, datatype: character varying, columntype: 1}

# 查询条件
conditions:
  where:
    - {feild: starttime, datatype: timestamp, symbol: '>=', val: '{start_date} 00:00:00', whereCon: and, query: true}
    - {feild: starttime, datatype: timestamp, symbol: '<', val: '{end_date} 23:59:59', whereCon: and, query: true}
    - {feild: city, datatype: character, symbol: in, val: '{city}', whereCon: and, query: true}
  fixed_params:
    draw: 1
    start: 0
    length: 200
    total: 0
    indexcount: 0
