# 5G干扰报表_自忙时
# 5G干扰报表自忙时版本

name: 5G_干扰报表_自忙时
table_key: 5G_干扰报表_自忙时
table_name: appdbv3.a_interfere_nrcell_zb4
fieldtype: 5G_干扰报表_自忙时
api_type: table

dimension:
  geographicdimension: 小区
  timedimension: 天、周
  enodebField: gnodeb_id
  cgiField: cgi
  timeField: starttime
  cellField: nrcell
  cityField: city

# 字段列表
fields:
  - {feild: starttime, feildName: 记录开始时间, datatype: '1', columntype: 1}
  - {feild: endtime, feildName: 记录结束时间, datatype: '1', columntype: 1}
  - {feild: ncgi, feildName: NCGI, datatype: character varying, columntype: 1}
  - {feild: nrcell_name, feildName: 小区名称, datatype: character varying, columntype: 1}
  - {feild: city, feildName: 所属地市, datatype: '1', columntype: 1}
  - {feild: cover_type, feildName: 覆盖类型, datatype: character varying, columntype: 1}
  - {feild: area, feildName: 所属区县, datatype: '1', columntype: 1}
  - {feild: cover_scene, feildName: 覆盖场景, datatype: character varying, columntype: 1}
  - {feild: gnodeb_id, feildName: 基站ID, datatype: character varying, columntype: 1}
  - {feild: gnodeb_name, feildName: 基站名称, datatype: character varying, columntype: 1}
  - {feild: state, feildName: 网元状态, datatype: character varying, columntype: 1}
  - {feild: grid, feildName: 责任网格, datatype: '1', columntype: 1}
  - {feild: grid_road, feildName: 路测网格, datatype: character varying, columntype: 1}
  - {feild: network_type, feildName: 网络制式, datatype: character varying, columntype: 1}
  - {feild: vendor, feildName: 厂家, datatype: character varying, columntype: 1}
  - {feild: bandwidth, feildName: 小区带宽, datatype: character varying, columntype: 1}
  - {feild: zb_time, feildName: 自忙时时间, datatype: character varying, columntype: 1}
  - {feild: freq, feildName: 频段, datatype: character varying, columntype: 1}
  - {feild: phy_ulmeannl_prb, feildName: 平均干扰电平值, datatype: character varying, columntype: 1}
  - {feild: d1_phy_ulmeannl_prb, feildName: d1频段平均干扰电平值, datatype: character varying, columntype: 1}
  - {feild: d2_phy_ulmeannl_prb, feildName: d2频段平均干扰电平值, datatype: character varying, columntype: 1}
  - {feild: interference_d1, feildName: D1频段干扰电平, datatype: numeric, columntype: 1}
  - {feild: interference_d2, feildName: D2频段干扰电平, datatype: numeric, columntype: 1}
  - {feild: interference_nr, feildName: NR干扰电平, datatype: numeric, columntype: 1}
  - {feild: is_interfere, feildName: 是否干扰小区, datatype: character varying, columntype: 1}

# 查询条件
conditions:
  where:
    - {feild: starttime, datatype: timestamp, symbol: '>=', val: '{start_date} 00:00:00', whereCon: and, query: true}
    - {feild: starttime, datatype: timestamp, symbol: '<', val: '{end_date} 23:59:59', whereCon: and, query: true}
    - {feild: city, datatype: character, symbol: in, val: '{city}', whereCon: and, query: true}
  fixed_params:
    draw: 1
    start: 0
    length: 200
    total: 0
    indexcount: 0
