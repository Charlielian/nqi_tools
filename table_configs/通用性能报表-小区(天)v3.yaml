# 通用性能报表-小区(天)v3

name: 通用性能报表-小区(天)v3
table_key: 通用性能报表-小区(天)v3
table_name: appdbv3.a_common_pm_lte_cell_d
fieldtype: 通用性能统计-小区(天)
api_type: table

dimension:
  geographicdimension: city
  timedimension: 天粒度
  enodebField: enodeb_id
  cgiField: cgi
  timeField: starttime
  cellField: cell
  cityField: city

# 字段列表（基础字段）
# 注意：此报表字段较复杂，可能需要动态获取
fields:
  - {feild: starttime, feildName: 记录开始时间, datatype: timestamp, columntype: 1}
  - {feild: endtime, feildName: 记录结束时间, datatype: timestamp, columntype: 1}
  - {feild: city, feildName: 所属地市, datatype: character varying, columntype: 1}
  - {feild: cgi, feildName: CGI, datatype: character varying, columntype: 1}
  - {feild: cell_name, feildName: 小区名称, datatype: character varying, columntype: 1}

# 查询条件
conditions:
  where:
    - {feild: starttime, datatype: timestamp, symbol: '>=', val: '{start_date} 00:00:00', whereCon: and, query: true}
    - {feild: starttime, datatype: timestamp, symbol: '<', val: '{end_date} 23:59:59', whereCon: and, query: true}
    - {feild: city, datatype: character, symbol: in, val: '{city}', whereCon: and, query: true}
  fixed_params:
    draw: 1
    start: 0
    length: 200
    total: 0
    indexcount: 0
