# 5G MR覆盖-小区天报表

name: 5GMR覆盖-小区天
table_key: appdbv3.a_common_mro_scssrsrp_nr_nrcell
table_name: appdbv3.a_common_mro_scssrsrp_nr_nrcell
fieldtype: 5GMR覆盖-小区天
api_type: table

dimension:
  geographicdimension: 小区，网格，地市，分公司
  timedimension: 天、周、月粒度
  enodebField: gnodeb_id
  cgiField: ncgi
  timeField: starttime
  cellField: nrcell
  cityField: city

# 字段列表
fields:
  - {feild: starttime, feildName: 记录开始时间, datatype: character varying, columntype: 1}
  - {feild: ncgi, feildName: 小区NCGI, datatype: character varying, columntype: 1}
  - {feild: nrcell_name, feildName: 小区名称, datatype: character varying, columntype: 1}
  - {feild: nr_rsrp_count, feildName: 移动RSRP采样的总采样点, datatype: character varying, columntype: 1}
  - {feild: nr_rsrp_gt_f110, feildName: 移动RSRP采样强于-110采样点, datatype: character varying, columntype: 1}
  - {feild: nr_rsrp_rate, feildName: 移动RSRP采样强于-110覆盖率(%), datatype: character varying, columntype: 1}
  - {feild: mro_yd_rsrp_avg, feildName: 移动平均RSRP, datatype: character varying, columntype: 1}
  - {feild: mro_lt_rsrp_avg, feildName: 联通平均RSRP, datatype: character varying, columntype: 1}
  - {feild: mro_dx_rsrp_avg, feildName: 电信平均RSRP, datatype: character varying, columntype: 1}
  - {feild: mro_rh_rsrp_avg, feildName: 融合竞对平均RSRP, datatype: character varying, columntype: 1}
  - {feild: mro_rh_all_count, feildName: 移动融合竞对均有RSRP采样的总采样点, datatype: character varying, columntype: 1}
  - {feild: mro_rh_yd_f110_count, feildName: 采集到融合频点是移动大于等于-110采样点, datatype: character varying, columntype: 1}
  - {feild: mro_rh_f110_count, feildName: 移动融合竞对均有RSRP采样的竞对强于-110采样点, datatype: character varying, columntype: 1}
  - {feild: mro_overlap_rsrp_count, feildName: 重叠覆盖采样点, datatype: character varying, columntype: 1}
  - {feild: mro_all_phr_count, feildName: PHR总采样点, datatype: character varying, columntype: 1}
  - {feild: mro_phr_lt_0, feildName: PHR小于0采样点数, datatype: character varying, columntype: 1}
  - {feild: mro_phr_lt_0_rate, feildName: PHR小于0采样点占比, datatype: character varying, columntype: 1}
  - {feild: mro_yd_ta_dist_avg, feildName: 移动平均TA(M), datatype: character varying, columntype: 1}

# 查询条件
conditions:
  where:
    - {feild: starttime, datatype: timestamp, symbol: '>=', val: '{start_date} 00:00:00', whereCon: and, query: true}
    - {feild: starttime, datatype: timestamp, symbol: '<', val: '{end_date} 23:59:59', whereCon: and, query: true}
    - {feild: city, datatype: character, symbol: in, val: '{city}', whereCon: and, query: true}
  fixed_params:
    draw: 1
    start: 0
    length: 200
    total: 0
    indexcount: 0
