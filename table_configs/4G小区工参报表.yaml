# 4G小区工参报表
# 工参表格：没有时间条件

name: 4G小区工参报表
table_key: appdbv3.v_a_common_cfg_lte_cellant_d
table_name: appdbv3.v_a_common_cfg_lte_cellant_d
fieldtype: 4G小区工参
api_type: table
is_gongcan: true

dimension:
  geographicdimension: 小区，网格，地市，分公司
  timedimension: 天粒度
  enodebField: enodeb_id
  cgiField: cgi
  timeField: starttime
  cellField: cell_name
  cityField: city

# 字段列表
fields:
  - {feild: starttime, feildName: 数据时间, datatype: character varying, columntype: 1}
  - {feild: cell_name, feildName: 小区名称, datatype: character varying, columntype: 2}
  - {feild: cgi, feildName: CGI, datatype: character varying, columntype: 1}
  - {feild: city, feildName: 地市, datatype: character varying, columntype: 1}
  - {feild: vendor, feildName: 设备厂家, datatype: character varying, columntype: 1}
  - {feild: station_name, feildName: 所属基站, datatype: character varying, columntype: 1}
  - {feild: earfcn, feildName: EARFCN, datatype: character varying, columntype: 1}
  - {feild: freq, feildName: 频段, datatype: character varying, columntype: 1}
  - {feild: bandwidth, feildName: 小区带宽, datatype: character varying, columntype: 1}
  - {feild: pci, feildName: PCI, datatype: character varying, columntype: 1}
  - {feild: tac, feildName: TAC, datatype: character varying, columntype: 1}
  - {feild: longitude, feildName: 经度, datatype: character varying, columntype: 1}
  - {feild: latitude, feildName: 纬度, datatype: character varying, columntype: 1}
  - {feild: azimuth, feildName: 方位角, datatype: character varying, columntype: 1}
  - {feild: electrical_tilt, feildName: 电子下倾角, datatype: character varying, columntype: 1}
  - {feild: mechanical_tilt, feildName: 机械下倾角, datatype: character varying, columntype: 1}
  - {feild: cover_type, feildName: 覆盖类型, datatype: character varying, columntype: 1}
  - {feild: txrx_mode, feildName: 收发模式, datatype: character varying, columntype: 1}
  - {feild: max_tx_power, feildName: 最大发射功率, datatype: character varying, columntype: 1}
  - {feild: rs_power, feildName: RS功率, datatype: character varying, columntype: 1}

# 查询条件（工参表不需要时间条件）
conditions:
  where:
    - {feild: city, datatype: character, symbol: in, val: '{city}', whereCon: and, query: true}
  fixed_params:
    draw: 1
    start: 0
    length: 200
    total: 0
