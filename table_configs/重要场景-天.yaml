# 查询条件
conditions:
  where:
    - {feild: starttime, datatype: timestamp, symbol: '>=', val: '{start_date} 00:00:00', whereCon: and, query: true}
    - {feild: starttime, datatype: timestamp, symbol: '<', val: '{end_date} 23:59:59', whereCon: and, query: true}
    - {feild: city, datatype: character, symbol: in, val: '{city}', whereCon: and, query: true}
  fixed_params:
    draw: 1
    start: 0
    length: 200
    total: 0
    indexcount: 0
