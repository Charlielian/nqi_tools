# 重要场景-天报表

name: 重要场景-天
table_key: 重要场景-小区天
table_name: appdbv3.a_overview_ispm_lte_cell_d
fieldtype: 重要场景-小区天
api_type: table

dimension:
  geographicdimension: 小区
  timedimension: 天
  enodebField: enodeb_id
  cgiField: cgi
  timeField: starttime
  cellField: cell
  cityField: city

