name: Build EXE

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Create config.yaml if not exists
      run: |
        if (!(Test-Path "config.yaml")) {
          New-Item -Path "config.yaml" -ItemType File -Force
          Add-Content -Path "config.yaml" -Value "# NQI工具配置文件"
          Add-Content -Path "config.yaml" -Value "# 请根据实际情况修改以下内容"
          Add-Content -Path "config.yaml" -Value ""
          Add-Content -Path "config.yaml" -Value "auth:"
          Add-Content -Path "config.yaml" -Value "  username: 'XXXXX'"
          Add-Content -Path "config.yaml" -Value "  password: 'XXXX'"
          Add-Content -Path "config.yaml" -Value ""
          Add-Content -Path "config.yaml" -Value "paths:"
          Add-Content -Path "config.yaml" -Value "  output_dir: './data_output'"
          Add-Content -Path "config.yaml" -Value "  cookie_dir: './cookies'"
          Add-Content -Path "config.yaml" -Value "  captcha_dir: './captcha_images'"
          Add-Content -Path "config.yaml" -Value "  log_dir: './logs'"
          Add-Content -Path "config.yaml" -Value ""
          Add-Content -Path "config.yaml" -Value "server:"
          Add-Content -Path "config.yaml" -Value "  base_url: 'https://nqi.gmcc.net:20443'"
        }

    - name: Build EXE using spec file
      run: |
        pyinstaller NqiTool.spec

    - name: Package release ZIP
      shell: pwsh
      run: |
        # 创建发布目录
        New-Item -Path "release/NqiTool" -ItemType Directory -Force

        # 复制 EXE
        Copy-Item "dist/NqiTool.exe" "release/NqiTool/"

        # 复制 config.yaml（打包前已创建）
        Copy-Item "config.yaml" "release/NqiTool/"

        # 复制授权工具公钥
        New-Item -Path "release/NqiTool/授权工具" -ItemType Directory -Force
        Copy-Item "授权工具/public_key.pem" "release/NqiTool/授权工具/"

        # 创建必要的运行时目录
        New-Item -Path "release/NqiTool/data_output" -ItemType Directory -Force
        New-Item -Path "release/NqiTool/cookies" -ItemType Directory -Force
        New-Item -Path "release/NqiTool/captcha_images" -ItemType Directory -Force
        New-Item -Path "release/NqiTool/logs" -ItemType Directory -Force

        # 打包为 ZIP
        Compress-Archive -Path "release/NqiTool" -DestinationPath "release/NqiTool.zip" -Force

        # 显示内容
        Write-Host "ZIP 包内容:"
        Get-ChildItem -Path "release/NqiTool" -Recurse | ForEach-Object { Write-Host "  $($_.FullName.Replace('release\NqiTool\', ''))" }

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: nqi_tool
        path: release/NqiTool.zip