name: Build EXE (Dual Versions: Tk & Qt6)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Tkinter Version EXE
        run: |
          pyinstaller NqiTool.spec

      - name: Build Qt6 Version EXE
        run: |
          pyinstaller NqiTool_qt.spec

      - name: Prepare release package
        shell: pwsh
        run: |
          $ReleaseDir = "release/NqiTool_Package"
          New-Item -Path $ReleaseDir -ItemType Directory -Force

          # 复制双版本可执行文件
          Copy-Item "dist/NqiTool.exe" "$ReleaseDir/NqiTool_classic_tk.exe"
          Copy-Item "dist/NqiTool_qt.exe" "$ReleaseDir/NqiTool_modern_qt.exe"

          # 创建默认 config.yaml
          $ConfigLines = @(
            "# NQI工具配置文件",
            "auth:",
            "  username: 'XXXXX'",
            "  password: 'XXXX'",
            "",
            "paths:",
            "  output_dir: './data_output'",
            "  cookie_dir: './cookies'",
            "  captcha_dir: './captcha_images'",
            "  log_dir: './logs'",
            "",
            "server:",
            "  base_url: 'https://nqi.gmcc.net:20443'",
            "",
            "logging:",
            "  detailed: false"
          )
          $ConfigLines | Set-Content -Path "$ReleaseDir/config.yaml" -Encoding UTF8

          # 创建运行时目录
          New-Item -Path "$ReleaseDir/data_output" -ItemType Directory -Force
          New-Item -Path "$ReleaseDir/cookies" -ItemType Directory -Force
          New-Item -Path "$ReleaseDir/captcha_images" -ItemType Directory -Force
          New-Item -Path "$ReleaseDir/logs" -ItemType Directory -Force

          # 创建 README
          $ReadmeLines = @(
            "# NQI 工具使用说明 (双版本)",
            "",
            "本安装包包含两个版本的可执行程序（共用 config.yaml 配置与数据输出目录）：",
            "",
            "1. 【推荐】NqiTool_modern_qt.exe：全新 Qt6 现代化科技风桌面版（支持纯白/极客暗双色主题切换、极速双日历、流式彩色日志）",
            "2. 【备用】NqiTool_classic_tk.exe：经典 Tkinter 极简兼容版",
            "",
            "首次运行前，修改 config.yaml 填写正确的用户名和密码即可双击运行。"
          )
          $ReadmeLines | Set-Content -Path "$ReleaseDir/README.txt" -Encoding UTF8

          # 打包为 ZIP 归档
          Compress-Archive -Path "$ReleaseDir" -DestinationPath "release/NqiTool_Windows_DualVersions.zip" -Force

          # 显示包内容
          Write-Host "=== ZIP 包内容 ==="
          Get-ChildItem -Path $ReleaseDir -Recurse | ForEach-Object {
            $relative = $_.FullName.Replace((Resolve-Path $ReleaseDir).Path + "\", "")
            Write-Host "  $relative"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NqiTool-Windows-DualVersions
          path: release/NqiTool_Windows_DualVersions.zip

      - name: Create Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/NqiTool_Windows_DualVersions.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
