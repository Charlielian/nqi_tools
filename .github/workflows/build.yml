name: Build EXE

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller NqiTool.spec

      - name: Prepare release package
        shell: pwsh
        run: |
          $ReleaseDir = "release/NqiTool"
          New-Item -Path $ReleaseDir -ItemType Directory -Force

          # 复制 EXE
          Copy-Item "dist/NqiTool.exe" "$ReleaseDir/"

          # 复制内置表格配置
          if (Test-Path "table_configs") {
            New-Item -Path "$ReleaseDir/table_configs" -ItemType Directory -Force
            Copy-Item "table_configs/*.yaml" "$ReleaseDir/table_configs/" -ErrorAction SilentlyContinue
          }

          # 自定义配置目录
          New-Item -Path "$ReleaseDir/custom_configs" -ItemType Directory -Force
          if (Test-Path "custom_configs") {
            Copy-Item "custom_configs/*" "$ReleaseDir/custom_configs/" -Recurse -ErrorAction SilentlyContinue
          }

          # 创建默认 config.yaml
          @"
# NQI工具配置文件
auth:
  username: 'XXXXX'
  password: 'XXXX'

paths:
  output_dir: './data_output'
  cookie_dir: './cookies'
  captcha_dir: './captcha_images'
  log_dir: './logs'

server:
  base_url: 'https://nqi.gmcc.net:20443'
"@ | Out-File -FilePath "$ReleaseDir/config.yaml" -Encoding UTF8

          # 创建运行时目录
          New-Item -Path "$ReleaseDir/data_output" -ItemType Directory -Force
          New-Item -Path "$ReleaseDir/cookies" -ItemType Directory -Force
          New-Item -Path "$ReleaseDir/captcha_images" -ItemType Directory -Force
          New-Item -Path "$ReleaseDir/logs" -ItemType Directory -Force

          # 创建 README
          @"
# NqiTool 使用说明

1. 首次运行前，修改 config.yaml 填写正确的用户名和密码
2. 双击 NqiTool.exe 启动程序
3. 导出的数据会保存在 data_output 目录中
"@ | Out-File -FilePath "$ReleaseDir/README.txt" -Encoding UTF8

          # 打包为 ZIP
          Compress-Archive -Path "release/NqiTool" -DestinationPath "release/NqiTool.zip" -Force

          # 显示包内容
          Write-Host "=== ZIP 包内容 ==="
          Get-ChildItem -Path $ReleaseDir -Recurse | ForEach-Object {
            $relative = $_.FullName.Replace((Resolve-Path $ReleaseDir).Path + "\", "")
            Write-Host "  $relative"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NqiTool-Windows
          path: release/NqiTool.zip

      - name: Create Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/NqiTool.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
